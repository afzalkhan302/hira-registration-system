<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Applications — Staff Dashboard</title>

<!-- The office's screen: never indexed, never previewed on social media. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="icon" type="image/png" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="site-head">
  <div class="wrap wrap--wide site-head__in">
    <a class="brand" href="./">
      <span class="brand__mark" data-logo style="background:linear-gradient(135deg,#4f46e5,#0f766e)">ST</span>
      <span class="brand__text">
        <span class="brand__name">Staff dashboard</span>
        <span class="brand__sub">Course applications</span>
      </span>
    </a>

    <div class="site-head__end" id="headActions" hidden>
      <span class="small muted" id="whoami" style="margin-inline-end:4px"></span>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh"><i data-icon="refresh"></i></button>
      <button class="icon-btn" id="signOutBtn" title="Sign out" aria-label="Sign out"><i data-icon="logout"></i></button>
    </div>
  </div>
</header>

<!-- ==================================================== sign in ========== -->
<main class="wrap gate" id="gate">
  <form class="card" id="gateForm">
    <div class="card__body">
      <div class="center" style="margin-bottom:18px">
        <div class="done__mark" style="background:var(--brand-soft);color:var(--brand-dark);width:54px;height:54px;margin-bottom:12px">
          <i data-icon="lock"></i>
        </div>
        <h1 style="font-size:1.2rem">Staff sign in</h1>
        <p class="small muted" style="margin-top:6px">Sign in to see the course applications.</p>
      </div>

      <div class="field" style="margin-bottom:14px">
        <label for="username">Username</label>
        <input class="control" id="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required>
        <span class="err" data-err="username"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input class="control" id="password" type="password" autocomplete="current-password" required>
        <span class="err" data-err="password"></span>
      </div>

      <label class="small muted" style="display:flex;gap:7px;align-items:center;margin:10px 0 4px">
        <input type="checkbox" id="remember"> Keep me signed in on this device
      </label>

      <button type="submit" class="btn btn--primary btn--block" id="gateBtn" style="margin-top:12px">
        <span class="spinner"></span><span class="btn__label">Log in</span>
      </button>

      <p class="tiny muted center" style="margin-top:14px">
        Checked on the server. Neither the username nor the password is stored in
        this website's code.
      </p>
    </div>
  </form>
</main>

<!-- ==================================================== dashboard ======== -->
<main class="wrap wrap--wide hidden" id="board" style="padding-top:22px">

  <section class="stats" id="stats" aria-label="Application counts"></section>

  <section class="toolbar">
    <div class="field">
      <label for="q">Search</label>
      <div class="search">
        <i data-icon="search" data-icon-class="icon--sm"></i>
        <input class="control" id="q" type="search" placeholder="Name, phone or application number">
      </div>
    </div>

    <div class="field">
      <label for="fCourse">Course</label>
      <select class="control" id="fCourse"><option value="">All courses</option></select>
    </div>

    <div class="field">
      <label for="fStatus">Status</label>
      <select class="control" id="fStatus">
        <option value="">All statuses</option>
        <option value="New">New</option>
        <option value="Contacted">Contacted</option>
        <option value="Approved">Approved</option>
        <option value="Rejected">Rejected</option>
      </select>
    </div>

    <button type="button" class="btn btn--ghost" id="resetBtn">Reset</button>
  </section>

  <p class="small muted" id="count" style="margin-bottom:10px"></p>

  <section class="rows" id="rows" aria-live="polite"></section>
</main>

<!-- ==================================================== detail =========== -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal__box">
    <div class="modal__head">
      <h2 id="mTitle">Application</h2>
      <button type="button" class="icon-btn" id="mClose" aria-label="Close"><i data-icon="x"></i></button>
    </div>

    <div class="modal__body" id="mBody"></div>

    <div class="modal__foot">
      <button type="button" class="btn btn--danger btn--sm" id="mDelete">
        <i data-icon="trash" data-icon-class="icon--sm"></i> Delete
      </button>
      <span style="flex:1"></span>
      <button type="button" class="btn btn--ghost btn--sm" id="mCancel">Close</button>
    </div>
  </div>
</div>

<div class="toasts"></div>

<!-- Firebase SDK (compat build — works with these classic scripts) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/firebase-api.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
